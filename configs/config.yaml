model:
  vocab_size: 65       # Dynamically updated from dataset characters
  d_model: 128
  n_heads: 4
  n_layers: 6
  block_size: 64

training:
  batch_size: 32
  learning_rate: 0.0008
  max_iters: 1500
  eval_interval: 300
  eval_iters: 20
  data_path: "data/input.txt"
  save_checkpoint: true
  checkpoint_path: "checkpoints/mini_gpt.pt"
